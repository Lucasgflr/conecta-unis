<article class="job-card"><div class="job-card-head">{% if job.company.avatar_file %}<img class="company-avatar avatar-image" src="/media/avatar/{{ job.company.id }}" alt="Logotipo da empresa {{ job.company.company_name or job.company.name }}">{% else %}<span class="company-avatar">{{ (job.company.company_name or job.company.name)[:1]|upper }}</span>{% endif %}<span class="badge badge-soft">{{ job.work_mode }}</span></div><h3><a href="/vagas/{{ job.id }}">{{ job.title }}</a></h3><p class="company-name">{{ job.company.company_name or job.company.name }}</p><div class="job-metadata"><span>⌖ {{ job.city }}</span><span>◷ {{ job.job_type }}</span></div><div class="job-card-footer"><span>Até {{ job.deadline.strftime('%d/%m/%Y') }}</span><a href="/vagas/{{ job.id }}" aria-label="Ver detalhes de {{ job.title }}">Ver vaga ↗</a></div></article>
